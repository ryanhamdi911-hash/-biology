<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Task Scheduler</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05050a;
            --bg2: #0a0a15;
            --card: rgba(20, 20, 35, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #00e5a0;
            --accent2: #7c6aff;
            --text: #f0f0f8;
            --muted: #8888aa;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-sizing: border-box;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 229, 160, 0.4);
        }

        .task-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .task-form.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .task-form h2 {
            font-family: 'Syne', sans-serif;
            margin-top: 0;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            box-sizing: border-box;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .task-detail {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 20px;
            width: 300px;
            transform: translateY(120%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .task-detail.active {
            transform: translateY(0);
        }

        .priority-tag {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .priority-high { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; border: 1px solid rgba(255, 107, 107, 0.3); }
        .priority-medium { background: rgba(255, 209, 102, 0.2); color: #ffd166; border: 1px solid rgba(255, 209, 102, 0.3); }
        .priority-low { background: rgba(0, 229, 160, 0.2); color: #00e5a0; border: 1px solid rgba(0, 229, 160, 0.3); }

        .instructions {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            color: var(--muted);
            font-size: 0.8rem;
            pointer-events: none;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1 style="font-size: 2rem;">INITIALIZING 3D WORLD...</h1>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <header>
            <h1>NEURAL<span>TASKS</span></h1>
            <button class="btn" onclick="toggleForm(true)">+ NEW TASK</button>
        </header>

        <div class="instructions">
            DRAG TO ROTATE • SCROLL TO ZOOM • CLICK OBJECTS TO VIEW DETAILS
        </div>
    </div>

    <div class="task-form" id="task-form">
        <h2>CREATE NEW TASK</h2>
        <form id="new-task-form">
            <div class="form-group">
                <label>Task Title</label>
                <input type="text" id="task-title" required placeholder="What needs to be done?">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="task-desc" rows="3" placeholder="Add some details..."></textarea>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select id="task-priority">
                    <option value="low">Low Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">INITIALIZE</button>
                <button type="button" class="btn btn-ghost" onclick="toggleForm(false)">ABORT</button>
            </div>
        </form>
    </div>

    <div class="task-detail" id="task-detail">
        <div id="detail-priority" class="priority-tag">HIGH</div>
        <h3 id="detail-title" style="margin: 0.5rem 0; font-family: 'Syne', sans-serif;">Task Title</h3>
        <p id="detail-desc" style="font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem;">Task description goes here.</p>
        <button class="btn btn-ghost" style="width: 100%;" onclick="completeTask()">MARK AS COMPLETE</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, raycaster, mouse;
        window.tasks = [];
        let taskMeshes = [];
        let selectedTask = null;

        const COLORS = {
            high: 0xff6b6b,
            medium: 0xffd166,
            low: 0x00e5a0,
            bg: 0x05050a
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLORS.bg);
            scene.fog = new THREE.FogExp2(COLORS.bg, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 10, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x7c6aff, 2, 50);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Environment
            createStars();
            createGrid();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onDocumentMouseDown);

            loadTasks();
            animate();

            // Loading screen removal
            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);
            }, 1000);
        }

        function createStars() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 5000; i++) {
                vertices.push(THREE.MathUtils.randFloatSpread(1000));
                vertices.push(THREE.MathUtils.randFloatSpread(1000));
                vertices.push(THREE.MathUtils.randFloatSpread(1000));
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
            const points = new THREE.Points(geometry, material);
            scene.add(points);
        }

        function createGrid() {
            const size = 100;
            const divisions = 50;
            const gridHelper = new THREE.GridHelper(size, divisions, 0x7c6aff, 0x222244);
            gridHelper.position.y = -5;
            gridHelper.material.opacity = 0.2;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Floating animation for tasks
            const time = Date.now() * 0.001;
            taskMeshes.forEach((mesh, index) => {
                mesh.position.y += Math.sin(time + index) * 0.005;
                mesh.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        // Global functions
        window.toggleForm = (show) => {
            document.getElementById('task-form').classList.toggle('active', show);
        };

        window.completeTask = () => {
            if (!selectedTask) return;
            window.tasks = window.tasks.filter(t => t.id !== selectedTask.id);
            saveTasks();
            syncScene();
            document.getElementById('task-detail').classList.remove('active');
            selectedTask = null;
        };

        // Task handling
        function loadTasks() {
            const saved = localStorage.getItem('neural_tasks');
            if (saved) {
                window.tasks = JSON.parse(saved);
            } else {
                // Default tasks if empty
                window.tasks = [
                    { id: 1, title: 'Explore the Interface', desc: 'Welcome to your 3D neural workspace.', priority: 'low' },
                    { id: 2, title: 'Create your first task', desc: 'Click the + NEW TASK button above.', priority: 'medium' }
                ];
            }
            syncScene();
        }

        function saveTasks() {
            localStorage.setItem('neural_tasks', JSON.stringify(window.tasks));
        }

        function syncScene() {
            // Clear existing
            taskMeshes.forEach(mesh => scene.remove(mesh));
            taskMeshes = [];

            window.tasks.forEach((task, index) => {
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                const material = new THREE.MeshPhongMaterial({
                    color: COLORS[task.priority],
                    transparent: true,
                    opacity: 0.8,
                    shininess: 100
                });
                const mesh = new THREE.Mesh(geometry, material);

                // Spiral/Cloud layout
                const angle = index * 0.5;
                const radius = 5 + index * 2;
                mesh.position.set(
                    Math.cos(angle) * radius,
                    Math.sin(index * 0.3) * 3,
                    Math.sin(angle) * radius
                );

                mesh.userData = task;
                scene.add(mesh);
                taskMeshes.push(mesh);

                // Add wireframe
                const wireframe = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geometry),
                    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })
                );
                mesh.add(wireframe);
            });
        }

        function onDocumentMouseDown(event) {
            event.preventDefault();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(taskMeshes);

            if (intersects.length > 0) {
                const task = intersects[0].object.userData;
                window.showTaskDetail(task);
            } else {
                document.getElementById('task-detail').classList.remove('active');
            }
        }

        window.showTaskDetail = (task) => {
            selectedTask = task;
            const detail = document.getElementById('task-detail');
            document.getElementById('detail-title').textContent = task.title;
            document.getElementById('detail-desc').textContent = task.desc;
            const pTag = document.getElementById('detail-priority');
            pTag.textContent = task.priority.toUpperCase();
            pTag.className = 'priority-tag priority-' + task.priority;

            detail.classList.add('active');
        }

        document.getElementById('new-task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                id: Date.now(),
                title: document.getElementById('task-title').value,
                desc: document.getElementById('task-desc').value,
                priority: document.getElementById('task-priority').value
            };
            window.tasks.push(newTask);
            saveTasks();
            syncScene();
            toggleForm(false);
            e.target.reset();
        });

        init();
    </script>
</body>
</html>
